# This file centralizes all dependency versions
# See: https://docs.gradle.org/current/userguide/version_catalog_basics.html

[versions]
# Core
java = "21"
kotlin = "2.4.21"
kotlin-coroutines = "1.11.0"

# PC (JavaFX)
javafx = "21.0.12"
javafxPlugin = "0.1.0"

# Common Libs
sqliteJdbc = "3.53.4.0"
junit6 = "6.1.3"
bouncycastle-pkix = "1.86"
bouncycastle-prov = "1.86"

androidGradlePluginVersion = "8.13.2"
androidxCore = "1.18.0"
androidxAppcompat = "1.8.0"
androidxMaterial = "1.14.0"
androidxGridlayout = "1.1.0"
androidxDocumentfile = "1.1.0"
androidxConstraintlayout = "2.2.2"
androidxNavigation = "2.10.2"
androidCompileSdk = "36"
androidMinSdk = "26"
androidTargetSdk = "36"

[libraries]
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqliteJdbc" }
bouncycastle-jdk18-prov = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle-prov" }
bouncycastle-jdk18-pkix = { module = "org.bouncycastle:bcpkix-jdk18on", version.ref = "bouncycastle-pkix" }

# testing
junit6-bom = { module = "org.junit:junit-bom", version.ref = "junit6" }
junit6-api = { module = "org.junit.jupiter:junit-jupiter-api" }
junit6-engine = { module = "org.junit.jupiter:junit-jupiter-engine" }
junit6-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
junit6-platform-commons = { module = "org.junit.platform:junit-platform-commons" }

# runtime & compile
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }
kotlin-coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlin-coroutines" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
javafx-base = { module = "org.openjfx:javafx-base", version.ref = "javafx" }
javafx-graphics = { module = "org.openjfx:javafx-graphics", version.ref = "javafx" }
javafx-controls = { module = "org.openjfx:javafx-controls", version.ref = "javafx" }
javafx-fxml = { module = "org.openjfx:javafx-fxml", version.ref = "javafx" }
javafx-swing = { module = "org.openjfx:javafx-swing", version.ref = "javafx" }
javafx-web = { module = "org.openjfx:javafx-web", version.ref = "javafx" }
openjfx-plugin-artifact = { module = "org.openjfx:javafx-plugin", version.ref = "javafxPlugin" }

androidx-core = { module = "androidx.core:core-ktx", version.ref = "androidxCore" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "androidxAppcompat" }
androidx-material = { module = "com.google.android.material:material", version.ref = "androidxMaterial" }
androidx-documentfile = { module = "androidx.documentfile:documentfile", version.ref = "androidxDocumentfile" }
androidx-gridlayout = { module = "androidx.gridlayout:gridlayout", version.ref = "androidxGridlayout" }
androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "androidxConstraintlayout" }
androidx-navigation-fragment = { module = "androidx.navigation:navigation-fragment-ktx", version.ref = "androidxNavigation" }
androidx-navigation-ui = { module = "androidx.navigation:navigation-ui-ktx", version.ref = "androidxNavigation" }

[bundles]
androidx = ["androidx-core", "androidx-appcompat", "androidx-material", "androidx-documentfile", "androidx-gridlayout", "androidx-constraintlayout", "androidx-navigation-fragment", "androidx-navigation-ui"]
