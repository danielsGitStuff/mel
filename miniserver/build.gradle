// miniserver/build.gradle

plugins {
    // 1. Replaces 'spring-boot', 'kotlin.jvm', and 'java'
    id 'mel-kotlin-application'
}

// 2. Configure the main class for './gradlew :miniserver:run'
application {
    // This assumes your main() is in a file named 'MiniServer.kt'
    // If it's in a companion object inside 'MiniServer', use: 'de.mel.web.miniserver.MiniServer'
    mainClass = 'de.mel.web.miniserver.MiniServer'
}

// 3. All dependencies are now clean and centrally managed
dependencies {
    // The plugin already provides kotlin-stdlib and JUnit
//    implementation project(':konsole')
//    implementation project(':blog')
//    implementation project(':auth')
    implementation libs.kotlin.coroutines
//    implementation libs.kotlin.io
//    implementation project(':serverparts')
//    implementation libs.sqlite.jdbc
//    testImplementation project(':auth')
    implementation project(':serverparts')
    implementation project(':auth')
    implementation project(':konsole')
    implementation project(':blog')
    testImplementation project(':auth')
}

