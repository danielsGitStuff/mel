plugins {
    id 'mel-javafx-application'
}

ext.variant = 'fx'

dependencies {
    api project(':filesyncfx')
    api project(':filedumpfx')
    api project(':contactsfx')
}

application {
    mainClass = 'de.mel.fxbundle.Main'
}
javafx {
    mainClassName = 'de.mel.fxbundle.Main'
}

// This manually adds all of 'filesync's test classes
// to this project's test compile and runtime classpaths.
// This is necessary to support your package-private access.
//
sourceSets {
    test {
        compileClasspath += project(':filesync').sourceSets.test.output
        runtimeClasspath += project(':filesync').sourceSets.test.output
    }
}

jar {
    // 1. Add the manifest for the runnable jar
    manifest {
        attributes(
                'Main-Class': 'de.mel.fxbundle.Main'
        )
    }

    // 2. The fat jar logic (to copy all files)
    from {
        configurations.runtimeClasspath.collect {
            it.isDirectory() ? it : zipTree(it)
        }
    } {
        // Exclude signature files to prevent errors
        exclude "META-INF/*.SF"
        exclude "META-INF/*.DSA"
        exclude "META-INF/*.RSA"
        exclude "module-info.class"
        exclude "META-INF/substrate/**"
        exclude "META-INF/versions/**"
//        exclude "META-INF/versions/9/module-info.class"
    }

    // This line tells Gradle to build all the project
    // dependencies *before* trying to build this fat jar.
    dependsOn configurations.runtimeClasspath.buildDependencies
}

