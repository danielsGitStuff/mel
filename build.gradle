// We need these for timestamp and git exec
import java.text.SimpleDateFormat
import java.io.ByteArrayOutputStream

// Function to get the current Git commit hash
def getGitCommitHash = { ->
    try {
        def out = new ByteArrayOutputStream()
        exec {
            commandLine 'git', 'rev-parse', 'HEAD'
            standardOutput = out
            // Don't fail the build if we're not in a git repo
            ignoreExitValue true
        }
        def hash = out.toString().trim()
        // Return a 7-char hash or a placeholder
        return hash.isEmpty() ? 'local' : hash.take(7)
    } catch (Exception e) {
        // Fallback for any other error
        return "no-git"
    }
}.call() // .call() runs this code once at the start

// Function to generate the dynamic part of the version
def getProjectVersion = { ->
    File f = new File(projectDir, "build.tmp.version")
    if (f.exists()) {
        // 1. Use the version from the file if it exists (for 'Deploy')
        println "Using version from build.tmp.version"
        return f.readLines().get(0)
    } else {
        // 2. Fallback for local dev builds (reads from gradle.properties)
        def major = project.findProperty('melMajorVersion') ?: '1'
        def minor = project.findProperty('melMinorVersion') ?: '0'
        def dynamic = new SimpleDateFormat("yyyy.MM.dd.HHmmss").format(new Date())
        def version = "${major}.${minor}.${dynamic}_dev"
        println "Generating dev version: ${version.toString()}"
        return version
    }
}.call() // .call() runs this once at the start

allprojects {
    group = 'de.mel'
    version = getProjectVersion // Apply the consistent version to all projects
    ext.commit = getGitCommitHash // Apply the consistent commit to all projects
    repositories {
        mavenCentral()
        google() // Needed for Android dependencies
    }
}

