
// Short hash of the current git commit, or a placeholder when git is not available.
// providers.exec replaces the project.exec{} that is removed in Gradle 9.
def getGitCommitHash = { ->
    try {
        def result = providers.exec {
            commandLine 'git', 'rev-parse', '--short=7', 'HEAD'
            workingDir = rootDir
            ignoreExitValue = true
        }
        def hash = result.standardOutput.asText.get().trim()
        return hash.isEmpty() ? 'local' : hash
    } catch (Exception e) {
        return "no-git"
    }
}.call()

// Release builds: the miniserver Deploy writes the version (a timestamp the updater can parse) into build.tmp.version.
// Dev builds: MAJOR.MINOR.<commit>_dev, stable between builds so tasks stay up to date. Dev versions are not
// parseable by the updater on purpose, they must not update themselves.
def getProjectVersion = { ->
    File f = new File(projectDir, "build.tmp.version")
    if (f.exists()) {
        println "Using version from build.tmp.version"
        return f.readLines().get(0)
    } else {
        def major = project.findProperty('melMajorVersion') ?: '1'
        def minor = project.findProperty('melMinorVersion') ?: '0'
        def version = "${major}.${minor}.${getGitCommitHash}_dev"
        println "Generating dev version: ${version}"
        return version
    }
}.call()

allprojects {
    group = 'de.mel'
    version = getProjectVersion // Apply the consistent version to all projects
    ext.commit = getGitCommitHash // Apply the consistent commit to all projects
    repositories {
        mavenCentral()
        google() // Needed for Android dependencies
    }
}

