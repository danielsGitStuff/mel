plugins {
    id 'mel-java-library'
}
dependencies {
    //
    // --- THIS IS THE FIX ---
    //
    // Remove the attribute fix from here as well.

    // 1. Import the BOM for the 'api' scope (for src/main/java)
    api platform(libs.junit6.bom)

    // 2. Import the BOM for the 'testFixtures' scope (for src/testFixtures/java)
    testFixturesImplementation platform(libs.junit6.bom)

    // 3. Now these dependencies will have their versions provided
    api libs.junit6.api
    runtimeOnly libs.junit6.engine // <-- No need for 'api' scope here

    // 4. Add dependencies for the test fixtures
    testFixturesImplementation libs.junit6.api
    // --- END OF FIX ---
}

