// build-logic/src/main/groovy/mel-kotlin-application.gradle

import org.gradle.api.attributes.Attribute

// <-- Add this import at the top

// 1. Apply Kotlin and Application plugins
plugins {
    id 'org.jetbrains.kotlin.jvm'
    id 'application'
    id 'java-test-fixtures' // For consistency
}

// 2. Get libs and versions
def libs = project.extensions.getByName("libs")
def javaVersion = JavaVersion.toVersion(libs.versions.java.get())
def javaVersionNumber = libs.versions.java.get().toInteger()

// 3. Configure Java
java {
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
}

// 4. Configure Kotlin
kotlin {
    jvmToolchain(javaVersionNumber)
}

// 5. Add dependencies
dependencies {
    implementation libs.kotlin.stdlib

    // --- Add all our standard JUnit 6 (or 5) dependencies ---
    testImplementation(platform(libs.junit6.bom)) {
        attributes {
            attribute(Attribute.of('org.jetbrains.kotlin.platform.type', String.class), 'platform-agnostic')
        }
    }
    testRuntimeOnly(platform(libs.junit6.bom)) {
        attributes {
            attribute(Attribute.of('org.jetbrains.kotlin.platform.type', String.class), 'platform-agnostic')
        }
    }
    testFixturesImplementation(platform(libs.junit6.bom)) {
        attributes {
            attribute(Attribute.of('org.jetbrains.kotlin.platform.type', String.class), 'platform-agnostic')
        }
    }

    testImplementation libs.junit6.api
    testRuntimeOnly libs.junit6.engine
    testFixturesImplementation libs.junit6.api

    // Without the launcher Gradle falls back to its own, older one: NoSuchMethodError in junit-platform-commons
    testImplementation libs.junit6.platform.commons
    testRuntimeOnly libs.junit6.platform.launcher
}

// 6. Configure test tasks
test {
    useJUnitPlatform {
        excludeTags 'ui', 'integration'
    }
}

tasks.register('integrationTest', Test) {
    group = 'verification'
    description = 'Runs tests tagged "integration" (real Mel instances on real sockets: minutes, not seconds). Part of check.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    shouldRunAfter test
    useJUnitPlatform {
        includeTags 'integration'
        excludeTags 'ui'
    }
}

tasks.named('check') {
    dependsOn 'integrationTest'
}

tasks.register('runUiTests', Test) {
    group = 'verification'
    description = 'Runs tests tagged "ui" (GUI/manual launchers that may never return). Use --tests to pick one.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    outputs.upToDateWhen { false }
    useJUnitPlatform {
        includeTags 'ui'
    }
    testLogging.showStandardStreams = true
}

MelApplicationHelper.configure(project)