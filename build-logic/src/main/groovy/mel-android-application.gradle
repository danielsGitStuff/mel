// build-logic/src/main/groovy/mel-android-application.gradle
import org.gradle.api.attributes.Attribute
import com.android.build.api.variant.ApplicationVariant
import org.gradle.api.tasks.testing.Test // Import the Test task for configuration
import com.android.build.api.component.AndroidComponentsExtension

// 1. Apply core plugins (No java-library)
plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// 2. Get libs and versions (unchanged)
def libs = project.extensions.getByName("libs")
def javaVersion = JavaVersion.toVersion(libs.versions.java.get())
def javaVersionNumber = libs.versions.java.get().toInteger()

// 3. Configure the 'android' block (Unchanged)
android {
    namespace = 'de.mel.android'

    compileSdk = libs.versions.androidCompileSdk.get().toInteger()

    defaultConfig {
        applicationId = 'de.mel.android'
        minSdk = libs.versions.androidMinSdk.get().toInteger()
        targetSdk = libs.versions.androidTargetSdk.get().toInteger()

        versionCode = 1
        versionName = project.version.toString()
    }
    // ... (compileOptions, etc.) ...
}

// 4. Configure Kotlin (for AGP)
kotlin {
    jvmToolchain(javaVersionNumber)
}

// 5. Add dependencies (Unchanged)
dependencies {
    implementation libs.kotlin.stdlib

    // JUnit 6 setup for LOCAL unit tests
    testImplementation(platform(libs.junit6.bom)) {
        attributes {
            attribute(Attribute.of('org.jetbrains.kotlin.platform.type', String.class), 'platform-agnostic')
        }
    }
    testRuntimeOnly(platform(libs.junit6.bom)) {
        attributes {
            attribute(Attribute.of('org.jetbrains.kotlin.platform.type', String.class), 'platform-agnostic')
        }
    }
    testImplementation libs.junit6.api
    testRuntimeOnly libs.junit6.engine
    testImplementation libs.junit6.platform.commons
    testRuntimeOnly libs.junit6.platform.launcher

    androidTestImplementation(platform(libs.junit6.bom)) {
        attributes {
            attribute(Attribute.of('org.jetbrains.kotlin.platform.type', String.class), 'platform-agnostic')
        }
    }
    androidTestImplementation libs.junit6.api
    androidTestRuntimeOnly libs.junit6.engine
}

//
// --- RESTORED TEST LOGIC & CORRECTED HOOKS ---
//

// 6. Restore Test/Tagging Logic (using generic task types - Fixes missing 'test' method)
tasks.withType(Test) {
    useJUnitPlatform {
        excludeTags 'ui'
    }
}

tasks.register('runUiTests', Test) {
    group = 'verification'
    description = 'Runs UI tests.'
    useJUnitPlatform {
        includeTags 'ui'
    }
}

// 7. Hook the tasks into the Android build (Final Syntax Fix)
//    We use a local variable (androidComponentsExtension) to avoid delegation failures.
def androidComponentsExtension = extensions.getByType(AndroidComponentsExtension) // <-- ACCESS THE PUBLIC INTERFACE

// 8. Define the action closure
def registerVariantHooks = { ApplicationVariant variant ->
    // Hook for the internal version.properties file
    variant.javaCompile.dependsOn(tasks.named('generateVersionProperties'))

    // Hook for the external file (for your update mechanism)
    if (variant.name == 'debug') {
        tasks.named("packageDebug").configure {
            it.finalizedBy(tasks.named('generateExternalVersionProperties'))
        }
    }
}

// 9. Apply the action using the correct API method
androidComponentsExtension.onVariants(registerVariantHooks)