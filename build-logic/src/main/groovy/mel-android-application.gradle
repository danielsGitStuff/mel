// build-logic/src/main/groovy/mel-android-application.gradle
import org.gradle.api.attributes.Attribute
import org.gradle.api.tasks.testing.Test // Import the Test task for configuration

// 1. Apply core plugins (No java-library)
plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// 2. Get libs and versions (unchanged)
def libs = project.extensions.getByName("libs")
def javaVersion = JavaVersion.toVersion(libs.versions.java.get())
def javaVersionNumber = libs.versions.java.get().toInteger()

// 3. Configure the 'android' block
//    keystore.properties (storeFile, storePassword, keyAlias, keyPassword) is written by the miniserver Deploy
//    and MUST stay private. Without it release builds are simply unsigned.
def keyStorePropFile = rootProject.file("keystore.properties")
def commit = (project.findProperty('commit') ?: project.rootProject.findProperty('commit') ?: 'local').toString()
def buildVersion = project.version.toString() == 'unspecified' ? '1.0.0-local' : project.version.toString() // unset when android/ is opened on its own

android {
    namespace = 'de.mel' // R class is imported as de.mel.R all over the code
    compileSdk = libs.versions.androidCompileSdk.get().toInteger()

    defaultConfig {
        applicationId = 'de.mel.mel' // must stay: changing it breaks app updates
        minSdk = libs.versions.androidMinSdk.get().toInteger()
        targetSdk = libs.versions.androidTargetSdk.get().toInteger()

        versionCode = 1
        versionName = buildVersion
        multiDexEnabled = true
        vectorDrawables.useSupportLibrary = true
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
        base.archivesName = rootProject.name
    }

    signingConfigs {
        if (keyStorePropFile.exists()) {
            def keyProps = new Properties()
            keyStorePropFile.withInputStream { keyProps.load(it) }
            release {
                storeFile = file(keyProps['storeFile'])
                storePassword = keyProps['storePassword']
                keyAlias = keyProps['keyAlias']
                keyPassword = keyProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            if (keyStorePropFile.exists())
                signingConfig = signingConfigs.release
            manifestPlaceholders = [appName: "Mel", icon: "ic_launcher"]
            buildConfigField("String", "BUILD_VARIANT", "\"apk-release\"")
            buildConfigField("String", "BUILD_COMMIT", "\"${commit}\"")
            buildConfigField("String", "BUILD_VERSION", "\"${buildVersion}\"")
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            debuggable = true
        }
        debug {
            manifestPlaceholders = [appName: "Mel DEBUG", icon: "ic_debug"]
            applicationIdSuffix = ".debug"
            buildConfigField("String", "BUILD_VARIANT", "\"apk-debug\"")
            buildConfigField("String", "BUILD_COMMIT", "\"${commit}\"")
            buildConfigField("String", "BUILD_VERSION", "\"${buildVersion}\"")
            minifyEnabled = false
        }
    }

    lint {
        abortOnError = true
    }

    packaging {
        resources {
            // every BouncyCastle jar (bcprov, bcpkix, bcutil) ships its own copy
            excludes += ['META-INF/LICENSE.md']
        }
    }

    buildFeatures {
        viewBinding = true
        buildConfig = true
    }

    compileOptions {
        sourceCompatibility = javaVersion
        targetCompatibility = javaVersion
    }
}

// 4. Configure Kotlin (for AGP)
kotlin {
    jvmToolchain(javaVersionNumber)
}

// 5. Add dependencies (Unchanged)
dependencies {
    implementation libs.kotlin.stdlib
    implementation libs.bundles.androidx

    // JUnit 6 setup for LOCAL unit tests
    testImplementation(platform(libs.junit6.bom)) {
        attributes {
            attribute(Attribute.of('org.jetbrains.kotlin.platform.type', String.class), 'platform-agnostic')
        }
    }
    testRuntimeOnly(platform(libs.junit6.bom)) {
        attributes {
            attribute(Attribute.of('org.jetbrains.kotlin.platform.type', String.class), 'platform-agnostic')
        }
    }
    testImplementation libs.junit6.api
    testRuntimeOnly libs.junit6.engine
    testImplementation libs.junit6.platform.commons
    testRuntimeOnly libs.junit6.platform.launcher

    androidTestImplementation(platform(libs.junit6.bom)) {
        attributes {
            attribute(Attribute.of('org.jetbrains.kotlin.platform.type', String.class), 'platform-agnostic')
        }
    }
    androidTestImplementation libs.junit6.api
    androidTestRuntimeOnly libs.junit6.engine
}

//
// --- RESTORED TEST LOGIC & CORRECTED HOOKS ---
//

// 6. Restore Test/Tagging Logic (using generic task types - Fixes missing 'test' method)
tasks.withType(Test) {
    useJUnitPlatform {
        excludeTags 'ui'
    }
}

tasks.register('runUiTests', Test) {
    group = 'verification'
    description = 'Runs UI tests.'
    useJUnitPlatform {
        includeTags 'ui'
    }
}

// The app itself reads version/commit/variant from BuildConfig (see MainActivity), so no bundled version.properties.
// The update mechanism (miniserver Deploy) wants "<apk name>.properties" next to every apk, like the jars get one.
def commitForProps = commit
def versionForProps = buildVersion
tasks.register('generateExternalVersionProperties') {
    description = 'Writes <apk>.properties (version, commit, variant) next to every built apk'
    doLast {
        def variantName = project.findProperty('variant') ?: 'apk'
        fileTree(dir: layout.buildDirectory.dir('outputs/apk').get().asFile, include: '**/*.apk').each { apk ->
            def props = new Properties()
            props['version'] = versionForProps
            props['commit'] = commitForProps
            props['variant'] = variantName.toString()
            new File(apk.parentFile, apk.name + '.properties').withWriter { w -> props.store(w, null) }
        }
    }
}
tasks.matching { it.name == 'assembleDebug' || it.name == 'assembleRelease' }.configureEach { t ->
    t.finalizedBy(tasks.named('generateExternalVersionProperties'))
}
